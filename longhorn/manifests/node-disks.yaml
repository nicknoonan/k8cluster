# Declare the two 4TB disks on "bigboi" for Longhorn (V1 data engine).
#
# The V1 data engine requires filesystem mount paths, so the raw devices
# /dev/sda and /dev/sdb must first be wiped, formatted ext4, and mounted at
# /mnt/longhorn/disk1 and /mnt/longhorn/disk2 on the host (see node prep
# done outside GitOps). Longhorn then manages replica/storage usage on the
# mounted filesystems.
#
# This Longhorn Node CR is applied via ArgoCD after the Longhorn chart
# installs its CRDs. Longhorn's node controller reads spec.disks and creates
# the disks.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: bigboi
  namespace: longhorn-system
spec:
  disks:
    disk-1:
      path: /mnt/longhorn/disk1
      allowScheduling: true
      storageReserved: 0
      tags: []
    disk-2:
      path: /mnt/longhorn/disk2
      allowScheduling: true
      storageReserved: 0
      tags: []