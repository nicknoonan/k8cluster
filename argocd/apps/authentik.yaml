apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2026.5.6
    helm:
      releaseName: authentik
      values: |
        authentik:
          # NOTE: secret_key and postgresql.password are intentionally left empty
          # here and injected from the `authentik-secrets` Secret via
          # server.env / worker.env below (see secretKeyRef).
          error_reporting:
            enabled: false
          postgresql:
            host: "authentik-postgresql"
            name: "authentik"
            user: "authentik"
            password: ""
            port: 5432

        server:
          replicas: 1
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - idp.nicknoonan.net
            tls:
              - secretName: authentik-tls
                hosts:
                  - idp.nicknoonan.net
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret-key
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: postgres-password
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: bootstrap-password
          resources:
            requests:
              cpu: 250m
              memory: 1500Mi
            limits:
              cpu: "1"
              memory: 1500Mi

        worker:
          replicas: 1
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret-key
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: postgres-password
            - name: AUTHENTIK_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: bootstrap-password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        postgresql:
          enabled: true
          auth:
            username: authentik
            database: authentik
            existingSecret: authentik-secrets
            secretKeys:
              userPasswordKey: postgres-password
              adminPasswordKey: postgres-password
          replication:
            enabled: false
          primary:
            resources:
              requests:
                cpu: 500m
                memory: 1000Mi
              limits:
                cpu: 1000m
                memory: 1000Mi
            persistence:
              enabled: true
              size: 20Gi
              storageClass: nfs

        # Maps the Authentik group "k8s-admins" (returned via the OIDC `groups`
        # claim) to the Kubernetes cluster-admin ClusterRole. This is what lets
        # Headlamp (and any other OIDC client) authorize those users.
        additionalObjects:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: authentik-k8s-admins
            subjects:
              - kind: Group
                name: k8s-admin
                apiGroup: rbac.authorization.k8s.io
            roleRef:
              kind: ClusterRole
              name: cluster-admin
              apiGroup: rbac.authorization.k8s.io

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true