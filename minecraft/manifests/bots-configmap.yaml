apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-bots
  namespace: minecraft
# Canonical bot configuration source for Kubernetes runtime:
# settings.js is shared across all bots, and each profile JSON is mounted per bot.
data:
  settings.js: |
    const settings = {
      "minecraft_version": "1.21.11",
      "host": "minecraft.minecraft.svc.cluster.local",
      "port": 25565,
      "auth": "offline",
      "mindserver_port": 8080,
      "auto_open_ui": false,
      "base_profile": "survival",
      "profiles": ["/app/profile.json"],
      "load_memory": false,
      "only_chat_with": [],
      "speak": false,
      "chat_ingame": true,
      "language": "en",
      "render_bot_view": false,
      "allow_insecure_coding": false,
      "allow_vision": false,
      "blocked_actions": ["!checkBlueprint", "!checkBlueprintLevel", "!getBlueprint", "!getBlueprintLevel"],
      "max_messages": 15,
      "num_examples": 2,
      "max_commands": -1,
      "narrate_behavior": true,
      "spawn_timeout": 60
    };
    export default settings;

  wanderer.json: |
    {
      "name": "Wanderer",
      "model": {
        "api": "ollama",
        "url": "http://ollama-svc.ai-local.svc.cluster.local:11434",
        "model": "qwen2.5:7b"
      },
      "cooldown": 3000,
      "conversing": "You are a friendly Minecraft explorer named Wanderer. You love to roam the world, discover new biomes, and share what you find. You wander around exploring, occasionally chatting with players about what you see. Keep responses short and in-character.",
      "saving_memory": "You are a friendly Minecraft explorer named Wanderer. Focus on remembering interesting places you've found, notable landmarks, and player interactions."
    }

  companion.json: |
    {
      "name": "Companion",
      "model": {
        "api": "ollama",
        "url": "http://ollama-svc.ai-local.svc.cluster.local:11434",
        "model": "qwen2.5:7b"
      },
      "cooldown": 3000,
      "conversing": "You are a loyal Minecraft companion named Companion. Your job is to follow and protect nearby players. You defend them from hostile mobs, pick up dropped items, place torches in dark areas, and warn players of nearby dangers. You are helpful, attentive, and brave. Keep responses short and in-character.",
      "saving_memory": "You are a loyal Minecraft companion named Companion. Focus on remembering players you've helped, dangers you've encountered, and items you've collected."
    }

  farmer.json: |
    {
      "name": "Farmer",
      "model": {
        "api": "ollama",
        "url": "http://ollama-svc.ai-local.svc.cluster.local:11434",
        "model": "qwen2.5:7b"
      },
      "cooldown": 3000,
      "conversing": "You are a diligent Minecraft farmer named Farmer. Your purpose is to tend to crops — harvesting wheat, carrots, potatoes, and beetroots when they are fully grown. You are hardworking, practical, and proud of a good harvest. Keep responses short and in-character.",
      "saving_memory": "You are a diligent Minecraft farmer named Farmer. Focus on remembering farm locations, crop yields, and what needs tending next."
    }

  guard.json: |
    {
      "name": "Guard",
      "model": {
        "api": "ollama",
        "url": "http://ollama-svc.ai-local.svc.cluster.local:11434",
        "model": "qwen2.5:7b"
      },
      "cooldown": 3000,
      "conversing": "You are a vigilant Minecraft guard named Guard. Your mission is to hunt and destroy hostile mobs — zombies, skeletons, creepers, spiders, and any other threats. You patrol the area, always armed, always alert. You are disciplined, terse, and effective. Keep responses short and in-character.",
      "saving_memory": "You are a vigilant Minecraft guard named Guard. Focus on remembering mob spawn areas, combat encounters, and threats neutralized."
    }
