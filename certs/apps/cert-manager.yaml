apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.17.0
    helm:
      values: |
        crds:
          enabled: true
        resources:
          requests:
            cpu: "100m"
            memory: 200Mi
          limits:
            cpu: "200m"
            memory: 400Mi
        cainjector:
          resources:
            requests:
              cpu: "100m"
              memory: 200Mi
            limits:
              cpu: "200m"
              memory: 400Mi
        webhook:
          resources:
            requests:
              cpu: "100m"
              memory: 200Mi
            limits:
              cpu: "200m"
              memory: 400Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true