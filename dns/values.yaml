# DNS Server Zone Settings
domain: nicknoonan.net

upstreamDns:
  - 1.1.1.1
  - 8.8.8.8

ttl: 30

hosts:
  - targetIp: 100.86.71.78
    name: internal-cluster
  - targetIp: 100.69.219.12
    name: cs2

# Subdomains to rewrite to internal hostname (e.g. internal-cluster.nicknoonan.net)
internalHostname: internal-cluster.nicknoonan.net
rewrites:
  - ai
  - argocd
  - code
  - grafana
  - headlamp
  - idp
  - k8s-mcp
  - seaweed
  - node-power-manager

# Node DNS Configurator Settings
nodeDnsConfigurator:
  enabled: true
  clusterDnsIp: 10.43.0.10
  image:
    alpine: alpine:3.19
    pause: registry.k8s.io/pause:3.9

# LAN Service Configuration
service:
  enabled: true
  name: coredns-lan
  loadBalancerIP: ""  # Optional: specify static IP if required by load balancer (e.g. MetalLB)