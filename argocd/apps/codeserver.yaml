apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codeserver
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/nicknoonan/k8cluster.git'
    targetRevision: HEAD
    path: codeserver
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: codeserver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
