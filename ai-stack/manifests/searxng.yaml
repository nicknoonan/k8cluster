apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: ai-local
data:
  settings.yml: |
    use_default_settings: true
    search:
      formats:
        - html
        - json
    server:
      bind_address: "0.0.0.0"
      port: 8080
      base_url: "http://searxng.ai-local.svc.cluster.local:8080/"
      secret_key: "brianlikesnuts"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: ai-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: searxng-config
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
      volumes:
      - name: searxng-config
        configMap:
          name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: ai-local
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: searxng
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: searxng-tls
  namespace: ai-local
spec:
  secretName: searxng-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - search.nicknoonan.net
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng
  namespace: ai-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - search.nicknoonan.net
      secretName: searxng-tls
  rules:
    - host: search.nicknoonan.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: searxng
                port:
                  number: 8080