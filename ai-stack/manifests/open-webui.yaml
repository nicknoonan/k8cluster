apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Added nodeSelector here to target the "bigboi" node
      nodeSelector:
        kubernetes.io/hostname: bigboi
      tolerations:
      - key: "bigboi"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        env:
        - name: OLLAMA_BASE_URL
          value: "http://ollama-svc.ai-local.svc.cluster.local:11434"
        - name: ENABLE_WEB_SEARCH
          value: "True"
        - name: WEB_SEARCH_ENGINE
          value: "searxng"
        - name: WEB_SEARCH_RESULT_COUNT
          value: "3"
        - name: WEB_SEARCH_CONCURRENT_REQUESTS
          value: "10"
        - name: SEARXNG_QUERY_URL
          value: "http://searxng.ai-local.svc.cluster.local:8080/search?q=<query>"
        # --- OIDC SSO via Authentik (idp.nicknoonan.net) ---
        - name: WEBUI_URL
          value: "https://ai.nicknoonan.net"
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        - name: OAUTH_PROVIDER_NAME
          value: "Authentik"
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: open-webui-oauth
              key: client-id
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: open-webui-oauth
              key: client-secret
        - name: OPENID_PROVIDER_URL
          value: "https://idp.nicknoonan.net/application/o/open-webui/.well-known/openid-configuration"
        - name: OPENID_REDIRECT_URI
          value: "https://ai.nicknoonan.net/oauth/oidc/callback"
        - name: OAUTH_SCOPES
          value: "openid email profile"
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: open-webui-oauth
              key: webui-secret-key
        # --- OAuth role mapping: Authentik group -> Open WebUI admin ---
        # Authentik's `roles` claim must contain "admin" (for admins) or "user"
        # (for everyone else). See the scope mapping in the Authentik provider.
        - name: ENABLE_OAUTH_ROLE_MANAGEMENT
          value: "true"
        - name: OAUTH_ROLES_CLAIM
          value: "roles"
        - name: OAUTH_ALLOWED_ROLES
          value: "user,admin"
        - name: OAUTH_ADMIN_ROLES
          value: "admin"
        resources:
          requests:
            cpu: "500m"
            memory: 1500Mi
          limits:
            cpu: "1"
            memory: 1500Mi
        volumeMounts:
        - name: webui-storage
          mountPath: /app/backend/data
      volumes:
      - name: webui-storage
        persistentVolumeClaim:
          claimName: open-webui-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: ai-local
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-svc
  namespace: ai-local
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 8080
    nodePort: 30080
  selector:
    app: open-webui
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: open-webui-tls
  namespace: ai-local
spec:
  secretName: open-webui-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ai.nicknoonan.net
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: ai-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - ai.nicknoonan.net
      secretName: open-webui-tls
  rules:
    - host: ai.nicknoonan.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui-svc
                port:
                  number: 3000