apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeserver
  namespace: codeserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codeserver
  template:
    metadata:
      labels:
        app: codeserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: bigboi
      tolerations:
      - key: bigboi
        operator: Exists
        effect: NoSchedule
      containers:
      - name: codeserver
        image: ghcr.io/nicknoonan/k8cluster/codeserver:sha-00cdc7d
        # Privileged so PlatformIO can flash/read boards attached to bigboi
        # (ttyUSB0/ttyACM0 etc.). Consistent with the already-mounted Docker
        # socket, which also grants host root via the Docker API.
        securityContext:
          privileged: true
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SUDO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codeserver-secret
              key: password
        - name: KUBECONFIG
          value: /etc/kubeconfig/config
        volumeMounts:
        - name: codeserver-data
          mountPath: /config
        - name: kubeconfig
          mountPath: /etc/kubeconfig
          readOnly: true
        # 1. Mount the host Docker socket into the container
        - name: docker-socket
          mountPath: /var/run/docker.sock
        # 3. Mount host devices so PlatformIO can flash/serial-monitor boards
        - name: dev
          mountPath: /dev
        resources:
          requests:
            cpu: "2000m"
            memory: "8Gi"
          limits:
            cpu: "8000m"
            memory: "8Gi"
      volumes:
      - name: codeserver-data
        persistentVolumeClaim:
          claimName: codeserver
      - name: kubeconfig
        secret:
          secretName: kubeconfig-secret
          defaultMode: 0444
      # 2. Define hostPath volume pointing to host's Docker socket
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      # 4. Define hostPath volume pointing to host's /dev for USB/serial access
      - name: dev
        hostPath:
          path: /dev
          type: Directory