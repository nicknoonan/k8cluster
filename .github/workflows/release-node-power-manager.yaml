name: release node-power-manager

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/node-power-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart
        run: |
          CHART_VERSION="$(awk -F': *' '$1 == "version" {print $2; exit}' platform/charts/node-power-manager/Chart.yaml)"
          APP_VERSION="$(awk -F': *' '$1 == "appVersion" {gsub(/"/, "", $2); print $2; exit}' platform/charts/node-power-manager/Chart.yaml)"
          if [ -z "$CHART_VERSION" ] || [ -z "$APP_VERSION" ]; then
            echo "Chart.yaml must define version and appVersion"
            exit 1
          fi
          helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          helm package ./platform/charts/node-power-manager --version "$CHART_VERSION" --app-version "$APP_VERSION"
          helm push "node-power-manager-$CHART_VERSION.tgz" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
