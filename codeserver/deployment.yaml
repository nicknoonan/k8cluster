apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeserver
  namespace: codeserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codeserver
  template:
    metadata:
      labels:
        app: codeserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: bigboi
      tolerations:
      - key: bigboi
        operator: Exists
        effect: NoSchedule
      containers:
      - name: codeserver
        image: ghcr.io/nicknoonan/k8cluster/codeserver:sha-c38cff5
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SUDO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codeserver-secret
              key: password
        - name: KUBECONFIG
          value: /etc/kubeconfig/config # Point directly to the dedicated secret mount
        volumeMounts:
        - name: codeserver-data
          mountPath: /config
        - name: kubeconfig
          mountPath: /etc/kubeconfig
          readOnly: true
        resources:
          requests:
            cpu: "2000m"
            memory: "8Gi"
          limits:
            cpu: "8000m"
            memory: "8Gi"
      volumes:
      - name: codeserver-data
        persistentVolumeClaim:
          claimName: codeserver
      - name: kubeconfig
        secret:
          secretName: kubeconfig-secret
          defaultMode: 0444 # World-readable permissions so user 1000 can access root-owned secret files