apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # Naming the key *.server tells CoreDNS to import this as an independent zone
  nicknoonan.server: |
    nicknoonan.net:53 {
        errors
        cache 30
        hosts {
            192.168.1.111 internal-cluster.nicknoonan.net
            192.168.69.69 test.nicknoonan.net
            fallthrough
        }
        forward . 1.1.1.1 8.8.8.8
    }