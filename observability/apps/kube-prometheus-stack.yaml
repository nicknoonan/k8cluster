apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 65.x.x
    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi
            resources:
              requests:
                memory: 1Gi
                cpu: 250m
              limits:
                memory: 1Gi
                cpu: 1000m
        grafana.ini:
          server:
            domain: grafana.nicknoonan.net
            root_url: https://grafana.nicknoonan.net/
            enforce_domain: true
          security:
            cookie_secure: true
        grafana:
          adminPassword: "admin"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "1000m"
              memory: 1Gi
          persistence:
            enabled: true
            size: 2Gi
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.nicknoonan.net
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.nicknoonan.net
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: "50m"
                memory: 50Mi
              limits:
                cpu: "50m"
                memory: 50Mi
        prometheusOperator:
          resources:
            requests:
              cpu: "50m"
              memory: 100Mi
            limits:
              cpu: "100m"
              memory: 100Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: "50m"
              memory: 100Mi
            limits:
              cpu: "100m"
              memory: 100Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: "50m"
              memory: 100Mi
            limits:
              cpu: "100m"
              memory: 100Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true