# Each bot runs as its own Deployment so it can be scaled and restarted independently.
# To add a bot: copy one block, change the name/username/role, and commit.
# To remove a bot: delete its block. ArgoCD will prune the Deployment automatically.
# Image is built and pushed by .github/workflows/minecraft-bot.yml.
#
# Bot image tag: update BOT_IMAGE_TAG in this file or pin it per-bot.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-bot-wanderer
  namespace: minecraft
  labels:
    app.kubernetes.io/name: minecraft-bot
    minecraft-bot/role: wander
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: minecraft-bot-wanderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft-bot
        app.kubernetes.io/instance: minecraft-bot-wanderer
        minecraft-bot/role: wander
    spec:
      restartPolicy: Always
      containers:
        - name: bot
          image: ghcr.io/nicknoonan/minecraft-bot:sha-b465ac1
          imagePullPolicy: Always
          env:
            - name: MC_HOST
              value: minecraft-headless.minecraft.svc.cluster.local
            - name: MC_PORT
              value: "25565"
            - name: BOT_USERNAME
              value: Wanderer
            - name: BOT_ROLE
              value: wander
            - name: MC_VERSION
              value: "1.21.4"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
