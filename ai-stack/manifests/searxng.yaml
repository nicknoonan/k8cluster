apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: ai-local
data:
  settings.yml: |
    use_default_settings: true
    search:
      formats:
        - html
        - json
    server:
      bind_address: "0.0.0.0"
      port: 8080
      base_url: "http://searxng.ai-local.svc.cluster.local:8080/"
      secret_key: "brianlikesnuts"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: ai-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: searxng-config
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
      volumes:
      - name: searxng-config
        configMap:
          name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: ai-local
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: searxng
