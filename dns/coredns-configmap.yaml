apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  data:
    nicknoonan.override: |
      # Override zone specifically for your domain
      nicknoonan.net:53 {
          errors
          cache 30
          hosts {
              192.168.1.111 internal-cluster.nicknoonan.net
              192.168.1.69 test.nicknoonan.net
              fallthrough
          }
          forward . 1.1.1.1
      }
    forward.override: |
      forward . 1.1.1.1 8.8.8.8