apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Longhorn Helm chart
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.0
      helm:
        releaseName: longhorn
        values: |
          defaultSettings:
            # Only create default disks on nodes explicitly labeled
            # node.longhorn.io/create-default-disk=true. We intentionally
            # do NOT label any node, so no default disk is created on the
            # OS drive -- storage comes exclusively from the explicit
            # 4TB block disks added on "bigboi".
            createDefaultDiskLabeledNodes: true
            # Single node storage cluster
            defaultReplicaCount: 1
            # Longhorn components must tolerate the bigboi taint
            taintToleration: bigboi:NoSchedule
          persistence:
            # Make the longhorn StorageClass the cluster default
            defaultClass: true
            defaultClassReplicaCount: 1
          longhornManager:
            tolerations:
              - key: bigboi
                operator: Exists
                effect: NoSchedule
          longhornDriver:
            tolerations:
              - key: bigboi
                operator: Exists
                effect: NoSchedule
          longhornUI:
            tolerations:
              - key: bigboi
                operator: Exists
                effect: NoSchedule
          csi:
            # k3s uses the default kubelet root dir
            kubeletRootDir: /var/lib/kubelet
    # Supporting manifests from this repo
    - repoURL: https://github.com/nicknoonan/k8cluster.git
      targetRevision: HEAD
      path: longhorn/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  # Longhorn's node controller manages the .status of Node CRs; ignore it so
  # ArgoCD doesn't report permanent drift / fight the controller.
  ignoreDifferences:
    - group: longhorn.io
      kind: Node
      jqPathExpressions:
        - .status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      # The Longhorn chart ships a longhorn-pre-upgrade helm hook that ArgoCD
      # runs before the chart's ServiceAccounts exist, blocking the sync. The
      # hook is a version-migration helper and isn't needed on fresh installs,
      # so bypass it.
      - DisableHook=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m