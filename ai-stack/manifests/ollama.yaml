apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: ai-local
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      tolerations:
      - key: bigboi
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ollama
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            sleep 5
            ollama pull llama3.1:8b
            ollama pull llama3.2:3b
            ollama pull qwen2.5:7b
            ollama pull qwen2.5-coder:7b
            ollama pull gemma4:12b
            wait
        env:
        - name: OLLAMA_NUM_CTX
          value: "16384"
        - name: OLLAMA_SCHED_SPREAD
          value: "1"
        ports:
        - containerPort: 11434
        resources:
          limits:
            nvidia.com/gpu: 2
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
  volumeClaimTemplates:
  - metadata:
      name: ollama-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-svc
  namespace: ai-local
spec:
  ports:
  - port: 11434
    targetPort: 11434
  selector:
    app: ollama
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ollama-tls
  namespace: ai-local
spec:
  secretName: ollama-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ollama.nicknoonan.net
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: ai-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - ollama.nicknoonan.net
      secretName: ollama-tls
  rules:
    - host: ollama.nicknoonan.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ollama-svc
                port:
                  number: 11434