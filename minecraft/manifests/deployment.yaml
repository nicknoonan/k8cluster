apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft-legacy
  namespace: minecraft
spec:
  serviceName: minecraft-legacy-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
      app.kubernetes.io/instance: minecraft-legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
        app.kubernetes.io/instance: minecraft-legacy
    spec:
      nodeSelector:
        kubernetes.io/hostname: bigboi
        kubernetes.io/os: linux
      tolerations:
        - key: bigboi
          operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoSchedule
      initContainers:
        - name: reset-world
          image: busybox:1.36
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              echo "Removing world data for fresh start..."
              rm -rf /data/world /data/world_nether /data/world_the_end /data/level.dat /data/level.dat_old
              echo "World reset complete."
          volumeMounts:
            - name: data
              mountPath: /data
        - name: stage-server-properties
          image: busybox:1.36
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - cp /config/server.properties /data/server.properties
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 8Gi
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: VANILLA
            - name: VERSION
              value: "1.21.11"
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-legacy-data
        - name: config
          configMap:
            name: minecraft-config
