apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeserver
  namespace: codeserver
spec:
  replicas: 1
  strategy:
    type: Recreate # Ensures volume detaches cleanly on updates
  selector:
    matchLabels:
      app: codeserver
  template:
    metadata:
      labels:
        app: codeserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: bigboi
      tolerations:
      - key: bigboi
        operator: Exists
        effect: NoSchedule
      containers:
      - name: codeserver
        image: ghcr.io/nicknoonan/k8cluster/codeserver:sha-7846807
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SUDO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codeserver-secret
              key: password
        # Option A: Points kubectl directly to the mounted file location
        - name: KUBECONFIG
          value: /config/.kube/config
        volumeMounts:
        - name: codeserver-data
          mountPath: /config
        - name: kubeconfig
          mountPath: /config/.kube/config
          subPath: config # Mounts only the file, leaving the rest of /config/.kube intact
          readOnly: true
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
      volumes:
      - name: codeserver-data
        persistentVolumeClaim:
          claimName: codeserver
      - name: kubeconfig
        secret:
          secretName: kubeconfig-secret
          items:
          - key: config # Change this to match the key name inside your Secret
            path: config
            mode: 0600