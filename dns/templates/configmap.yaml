apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{ .Values.domain }}.server: |
    {{ .Values.domain }}:53 {
        errors
        cache {{ .Values.ttl }}

        # Rewrite rules
        {{- range .Values.rewrites }}
        rewrite name exact {{ . }}.{{ $.Values.domain }} {{ $.Values.targetHostname }}
        {{- end }}

        hosts {
            {{ .Values.targetIp }} {{ .Values.targetHostname }}
            fallthrough
        }
        forward . {{ range .Values.upstreamDns }}{{ . }} {{ end }}
    }