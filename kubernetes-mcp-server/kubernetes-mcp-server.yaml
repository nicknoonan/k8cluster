apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-mcp-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/containers/charts
    chart: kubernetes-mcp-server
    targetRevision: 0.1.0
    helm:
      releaseName: kubernetes-mcp-server
      values: |
        fullnameOverride: kubernetes-mcp-server
        rbac:
          create: true
          extraClusterRoleBindings:
            - name: admin
              roleRef:
                name: cluster-admin
                external: true
        ingress:
          enabled: true
          className: traefik
          host: k8s-mcp.nicknoonan.net
          path: /
          pathType: Prefix
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            cert-manager.io/cluster-issuer: letsencrypt-prod
          tls:
            secretName: k8s-mcp-tls
        extraArgs:
          - --stateless
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-mcp-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true