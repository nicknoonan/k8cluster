apiVersion: v1
kind: Service
metadata:
  name: minecraft-headless
  namespace: minecraft
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/instance: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/instance: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
